# Pages CMS (https://app.pagescms.org): where Anatoly edits his works. Saves go to data/works.json
# and assets/works/; .github/workflows/works.yml then rebuilds the portfolio. Labels are Russian,
# the texts on the site Slovak.
media:
  input: assets/works
  output: assets/works
  rename: random
  extensions: [jpg, jpeg, png, webp, heic, heif]

content:
  - name: works
    label: Работы
    type: file
    path: data/works.json
    format: json
    list: true
    operations:
      delete: false
    commit:
      templates:
        update: "Works: update the list (via Pages CMS)"
    fields:
      - name: photo
        label: Фото
        type: image
        required: true
        description: Фото с телефона как есть. На сайте появится через 2–3 минуты после сохранения; первая в списке показывается первой.
        options:
          extensions: [jpg, jpeg, png, webp, heic, heif]
      - name: title
        label: Название
        type: string
        required: true
        description: По-словацки, коротко. Например «Líška a pivónie.»
        options:
          maxlength: 80
      - name: category
        label: Стиль · место
        type: string
        description: По-словацки. Например «Farebná kompozícia · rukáv».
        options:
          maxlength: 80
      - name: description
        label: Описание
        type: text
        description: Необязательно. Одно-два предложения по-словацки.
        options:
          maxlength: 300
      - name: alt
        label: Что на фото
        type: string
        description: Необязательно. Коротко, по-словацки — для поиска и незрячих.
        options:
          maxlength: 160
      - name: crop
        label: Кадр превью
        type: string
        description: Необязательно. Что видно в маленьком превью — «50% 30%» выше центра, «50% 70%» ниже, «30% 50%» левее. Пусто — центр.
