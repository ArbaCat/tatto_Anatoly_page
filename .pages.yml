# Pages CMS (https://app.pagescms.org): the admin where Anatoly adds and edits his works.
# It saves to data/works.json and uploads photos to assets/works/. Every save starts
# .github/workflows/works.yml, which runs scripts/build_works.py: it tidies new photos
# (upright, smaller, no location data), makes the small copies and rebuilds the portfolio
# in index.html. Labels are in Russian; the texts themselves go on the site in Slovak.
media:
  input: assets/works
  output: assets/works
  rename: random
  extensions: [jpg, jpeg, png, webp, heic, heif]

content:
  - name: works
    label: Работы
    type: file
    path: data/works.json
    format: json
    list: true
    operations:
      delete: false
    commit:
      templates:
        update: "Works: update the list (via Pages CMS)"
    fields:
      - name: photo
        label: Фото
        type: image
        required: true
        description: Обычное фото с телефона. Сайт сам повернёт его, уменьшит и уберёт геоданные. Работа появится на сайте через 2–3 минуты после сохранения. Первая работа в списке показывается на сайте первой.
        options:
          extensions: [jpg, jpeg, png, webp, heic, heif]
      - name: title
        label: Название
        type: string
        required: true
        description: По-словацки, коротко. Например «Líška a pivónie.»
        options:
          maxlength: 80
      - name: category
        label: Стиль · место
        type: string
        description: По-словацки. Например «Farebná kompozícia · rukáv».
        options:
          maxlength: 80
      - name: description
        label: Описание
        type: text
        description: Необязательно. Одно-два предложения по-словацки.
        options:
          maxlength: 300
      - name: alt
        label: Что на фото
        type: string
        description: Необязательно. Короткое описание для поиска и незрячих, по-словацки. Если пусто, используется название.
        options:
          maxlength: 160
      - name: crop
        label: Кадр превью
        type: string
        description: "Какая часть фото видна в маленьком превью (оно вертикальное, 4 : 5). «50% 50%» — центр, «50% 30%» — выше, «50% 70%» — ниже, «30% 50%» — левее. Пусто — центр."
